<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="#2d5a8e" opacity="0.9"/>

  <!-- Livro / catálogo aberto -->
  <rect x="12" y="14" width="18" height="30" rx="2" fill="white" opacity="0.95"/>
  <rect x="34" y="14" width="18" height="30" rx="2" fill="white" opacity="0.95"/>
  <rect x="29" y="14" width="6"  height="30" fill="#c8daf5"/>

  <!-- Linhas da página esquerda -->
  <line x1="16" y1="21" x2="26" y2="21" stroke="#2d5a8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="26" y2="26" stroke="#2d5a8e" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="31" x2="26" y2="31" stroke="#2d5a8e" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="36" x2="22" y2="36" stroke="#2d5a8e" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Miniatura de móvel na página direita (gaveteiro) -->
  <rect x="36" y="20" width="14" height="4" rx="1" fill="#3498db" opacity="0.8"/>
  <rect x="36" y="26" width="14" height="4" rx="1" fill="#3498db" opacity="0.7"/>
  <rect x="36" y="32" width="14" height="4" rx="1" fill="#3498db" opacity="0.6"/>
  <circle cx="43" cy="22" r="1" fill="white"/>
  <circle cx="43" cy="28" r="1" fill="white"/>
  <circle cx="43" cy="34" r="1" fill="white"/>

  <!-- Badge verde "+" indicando adicionar / catálogo -->
  <circle cx="48" cy="48" r="10" fill="#27ae60"/>
  <line x1="44" y1="48" x2="52" y2="48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="44" x2="48" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
