<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3d6b3d" opacity="0.9"/>
  <!-- Wrench/screw icon -->
  <!-- Screw body -->
  <rect x="28" y="10" width="8" height="32" rx="4" fill="white" opacity="0.95"/>
  <!-- Screw head (hex) -->
  <polygon points="32,6 38,9 38,15 32,18 26,15 26,9" fill="#a8d5a8" stroke="white" stroke-width="1"/>
  <!-- Slot on head -->
  <line x1="29" y1="12" x2="35" y2="12" stroke="#3d6b3d" stroke-width="2"/>
  <!-- Screw tip -->
  <polygon points="28,42 36,42 32,50" fill="white" opacity="0.95"/>
  <!-- Two small dots (bolt pattern) -->
  <circle cx="20" cy="48" r="4" fill="white" opacity="0.85"/>
  <circle cx="44" cy="48" r="4" fill="white" opacity="0.85"/>
  <!-- Hinge shape hint -->
  <rect x="14" y="44" width="10" height="3" rx="1.5" fill="#a8d5a8"/>
  <rect x="40" y="44" width="10" height="3" rx="1.5" fill="#a8d5a8"/>
</svg>
