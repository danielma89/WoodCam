<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plano de corte: vista top-down com régua e marcações -->
  <!-- chapa -->
  <rect x="8" y="8" width="48" height="48" rx="2" fill="#eef6fb" stroke="#262d33" stroke-width="2.6"/>
  <!-- régua topo -->
  <rect x="8" y="8" width="48" height="6" rx="0" fill="#69aee0" stroke="#262d33" stroke-width="2.0"/>
  <!-- régua esquerda -->
  <rect x="8" y="8" width="6" height="48" rx="0" fill="#69aee0" stroke="#262d33" stroke-width="2.0"/>
  <!-- marcações régua top -->
  <line x1="19" y1="8" x2="19" y2="12" stroke="#262d33" stroke-width="1.4"/>
  <line x1="27" y1="8" x2="27" y2="12" stroke="#262d33" stroke-width="1.4"/>
  <line x1="35" y1="8" x2="35" y2="12" stroke="#262d33" stroke-width="1.4"/>
  <line x1="43" y1="8" x2="43" y2="12" stroke="#262d33" stroke-width="1.4"/>
  <line x1="51" y1="8" x2="51" y2="12" stroke="#262d33" stroke-width="1.4"/>
  <!-- marcações régua left -->
  <line x1="8" y1="19" x2="12" y2="19" stroke="#262d33" stroke-width="1.4"/>
  <line x1="8" y1="27" x2="12" y2="27" stroke="#262d33" stroke-width="1.4"/>
  <line x1="8" y1="35" x2="12" y2="35" stroke="#262d33" stroke-width="1.4"/>
  <line x1="8" y1="43" x2="12" y2="43" stroke="#262d33" stroke-width="1.4"/>
  <line x1="8" y1="51" x2="12" y2="51" stroke="#262d33" stroke-width="1.4"/>
  <!-- peças encaixadas -->
  <rect x="16" y="16" width="18" height="14" rx="1.5" fill="#f0a45d" stroke="#262d33" stroke-width="2.0"/>
  <rect x="37" y="16" width="15" height="9"  rx="1.5" fill="#ffd18d" stroke="#262d33" stroke-width="2.0"/>
  <rect x="16" y="33" width="10" height="19" rx="1.5" fill="#ffd18d" stroke="#262d33" stroke-width="2.0"/>
  <rect x="29" y="33" width="23" height="9"  rx="1.5" fill="#f0a45d" stroke="#262d33" stroke-width="2.0"/>
  <rect x="29" y="45" width="10" height="7"  rx="1.5" fill="#ffd18d" stroke="#262d33" stroke-width="2.0"/>
  <rect x="37" y="28" width="15" height="5"  rx="1.5" fill="#f0a45d" stroke="#262d33" stroke-width="2.0"/>
  <rect x="42" y="45" width="10" height="7"  rx="1.5" fill="#ffd18d" stroke="#262d33" stroke-width="2.0"/>
</svg>
